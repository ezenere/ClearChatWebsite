[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clearchat-server"
version = "0.1.0"
description = "ClearChat — servidor de sincronização zero-knowledge (FastAPI + Postgres)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "aiosmtplib>=3.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "websockets>=13",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["clearchat_server*"]

[tool.setuptools.package-data]
clearchat_server = ["db/alembic/*.py", "db/alembic/*.mako", "db/alembic/versions/*.py", "mail/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../admin"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["clearchat_server/db/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert (testes)
  "S608",   # SQL montado só com placeholders/identificadores internos
  "S105", "S106",  # nomes como *_token/*_password não são segredos hardcoded
  "B008",   # Depends() em defaults (padrão do FastAPI)
  "RUF001", "RUF002", "RUF003",  # textos pt-BR com caracteres "ambíguos"
  "S104",   # bind 0.0.0.0 dentro do container é intencional
  "ASYNC109",
  "E501",   # o formatter cuida das linhas; sobram só strings SQL longas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "ASYNC", "RUF059"]

[tool.mypy]
python_version = "3.12"
packages = ["clearchat_server"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
