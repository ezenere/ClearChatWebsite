# ClearChat — exemplo de server block do Nginx do host (TLS termina aqui). Ver docs/ARCHITECTURE.md §5 e §8.1.
# No bloco http {}:
#   limit_req_zone $binary_remote_addr zone=cc_auth:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=cc_api:10m  rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=cc_ws:10m   rate=20r/m;
#   limit_req_status 429;

# http {} : zonas de limit_req da §5
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    http2 on;
    server_name clear.ezenere.com;
    # ssl_certificate / ssl_certificate_key …  (TLS termina aqui)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # --- OPCIONAL — só se o domínio estiver com o proxy da Cloudflare ligado (nuvem laranja) ----------
    # Com o proxy, toda conexão chega de uma borda da Cloudflare e $remote_addr (logo X-Real-IP, os limites
    # do Nginx e os do backend) seria o IP da borda. Descomente as linhas abaixo para o Nginx (realip) usar o
    # CF-Connecting-IP — aceito SÓ quando a conexão vem das faixas da Cloudflare (ninguém mais forja).
    # Quem não passa pela Cloudflare (rede local, acesso direto) continua com o próprio IP.
    # Com DNS only (sem proxy), deixe comentado. Ver docs/ARCHITECTURE.md §8.1.
    # Faixas de https://www.cloudflare.com/ips-v4 e /ips-v6 (conferidas em 2026-10-19; revisar de vez em quando).
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;
    # ---------------------------------------------------------------------------------------------

    # cabeçalhos de IP: SOBRESCREVER (nunca repassar o que o cliente mandou); $remote_addr é o IP real
    # (com o proxy da Cloudflare, só depois de descomentar o bloco acima)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        limit_req zone=cc_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
    location /api/v1/blobs/ {
        limit_req zone=cc_api burst=60 nodelay;
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8100;
    }
    location /api/ {
        limit_req zone=cc_api burst=60 nodelay;
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:8100;
    }
    location = /ws {
        limit_req zone=cc_ws burst=10;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # um location com proxy_set_header próprio NÃO herda os do server: repetir os de IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;     # heartbeats a cada 15 s mantêm viva
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8101;   # SPA (o container web faz o fallback para index.html)
    }
    # NUNCA: nenhum location para 127.0.0.1:8190 (admin)
}
server { listen 80; server_name clear.ezenere.com; return 301 https://$host$request_uri; }
