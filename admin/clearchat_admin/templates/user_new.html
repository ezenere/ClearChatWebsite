{% extends "base.html" %}{% block title %}Criar usuário{% endblock %}
{% block content %}
<h1>Criar usuário</h1>
<div class="card" style="max-width:560px">
  <p class="muted">A conta nasce sem chaves: a pessoa entra por código e define a senha de criptografia no site (<code>/setup</code>).</p>
  {% if error %}<p class="danger">{{ error }}</p>{% endif %}
  <form method="post" action="/users/new">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail <input type="email" name="email" required></label>
    <label>Nome <input type="text" name="name" required maxlength="100"></label>
    <label><input type="checkbox" name="send_welcome" value="1" checked> Enviar e-mail de boas-vindas com o link de login</label>
    <button>Criar</button>
  </form>
</div>
{% endblock %}
